<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smoothies">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Family Smoothies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&display=swap">

<style>
/* Layout: a soft juice-coloured wash; every smoothie is a card glowing in its own colours,
   big light figures, frosted-glass controls floating over colour, one column of detail cards.
   Presses, wobbles and slides are driven from the script (see motion), so no CSS here animates transform on press. */
:root {
  --bg: #F2F1EE; --surface: #FFFFFF; --surface-2: #EBEAE6; --sunk: #E4E2DD;
  --glass: rgba(255,255,255,.58); --glass-solid: rgba(250,249,246,.95); --glass-hi: rgba(255,255,255,.78); --glass-line: rgba(255,255,255,.75); --glass-shadow: 0 10px 30px rgba(30,25,20,.10), 0 1px 2px rgba(30,25,20,.06);
  --ink: #16161A; --ink-2: #5E5D63; --ink-3: #9A999F; --line: rgba(22,22,26,.08); --line-2: rgba(22,22,26,.14);
  --accent: #EF5A24; --accent-ink: #FFFFFF; --ok: #2C9C62; --warn: #C9711F; --warn-bg: rgba(239,140,40,.12); --fav: #EF3E5C;
  --wash: radial-gradient(85% 42% at 8% -4%, rgba(255,160,105,.42), transparent 72%),
          radial-gradient(70% 38% at 100% 4%, rgba(160,195,255,.38), transparent 70%),
          radial-gradient(90% 40% at 60% 104%, rgba(255,205,150,.30), transparent 72%),
          linear-gradient(180deg, #F7F1EB 0%, var(--bg) 46%);
  --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; 
  --ease: cubic-bezier(.16,1,.3,1); --spring: cubic-bezier(.34,1.4,.64,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --wash: radial-gradient(85% 42% at 8% -4%, rgba(255,120,60,.22), transparent 72%), radial-gradient(70% 38% at 100% 4%, rgba(90,120,255,.20), transparent 70%), radial-gradient(90% 40% at 60% 104%, rgba(150,70,170,.16), transparent 72%), linear-gradient(180deg, #12100F 0%, var(--bg) 50%);
  --bg: #0A0B0D; --surface: #15161A; --surface-2: #1D1E23; --sunk: #101114;
  --glass: rgba(28,29,34,.55); --glass-solid: rgba(28,29,34,.96); --glass-hi: rgba(40,41,47,.72); --glass-line: rgba(255,255,255,.09); --glass-shadow: 0 10px 30px rgba(0,0,0,.45);
  --ink: #F3F3F5; --ink-2: #A4A4AC; --ink-3: #6B6B74; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --accent: #FF8442; --accent-ink: #1A0E06; --ok: #45C27F; --warn: #F0A050; --warn-bg: rgba(240,160,80,.12); --fav: #FF5A75; color-scheme: dark; } }
:root[data-theme="dark"] {
  --wash: radial-gradient(85% 42% at 8% -4%, rgba(255,120,60,.22), transparent 72%), radial-gradient(70% 38% at 100% 4%, rgba(90,120,255,.20), transparent 70%), radial-gradient(90% 40% at 60% 104%, rgba(150,70,170,.16), transparent 72%), linear-gradient(180deg, #12100F 0%, var(--bg) 50%);
  --bg: #0A0B0D; --surface: #15161A; --surface-2: #1D1E23; --sunk: #101114;
  --glass: rgba(28,29,34,.55); --glass-solid: rgba(28,29,34,.96); --glass-hi: rgba(40,41,47,.72); --glass-line: rgba(255,255,255,.09); --glass-shadow: 0 10px 30px rgba(0,0,0,.45);
  --ink: #F3F3F5; --ink-2: #A4A4AC; --ink-3: #6B6B74; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --accent: #FF8442; --accent-ink: #1A0E06; --ok: #45C27F; --warn: #F0A050; --warn-bg: rgba(240,160,80,.12); --fav: #FF5A75; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* The app scrolls inside its own box, never the page itself: Safari draws a screen transition at the wrong
   height if the page scrolls while it starts, and every screen change resets or restores the scroll. */
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.scroller { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
/* the backdrop: a soft wash of juice colours that fades into the page, fixed behind everything */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--wash); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* no double-tap zoom on quick repeated taps, and no text-select or callout when a finger rests on a card */
button, [role="checkbox"] { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.page { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- glass controls (round buttons, pills, segmented) ---------- */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); box-shadow: inset 0 0 0 1px var(--glass-line), var(--glass-shadow); }
/* Safari draws frosted glass as a hard-edged blurred rectangle while a screen transition plays,
   so glass turns briefly solid for the length of each transition */
:root[data-vt] .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--glass-solid); }
.rb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background-color .2s; }
.rb svg { width: 21px; height: 21px; }
.rb.on .heart { fill: var(--fav); stroke: var(--fav); }
.pillbtn { height: 40px; padding: 0 16px 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; font: 500 15px/1 var(--sans); }
.pillbtn svg { width: 20px; height: 20px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; }
.seg button { position: relative; z-index: 1; height: 34px; padding: 0 16px; border-radius: 999px; font: 500 14px/1 var(--sans); color: var(--ink-2); transition: color .25s; white-space: nowrap; }
.seg button.on { color: var(--ink); }
.seg .th { position: absolute; top: 4px; left: 4px; height: 34px; width: calc((100% - 8px) / var(--n)); border-radius: 999px; background: var(--glass-hi); box-shadow: 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 1px var(--glass-line); transform: translateX(calc(var(--i) * 100%)); transition: transform .4s var(--ease); }

/* ---------- type ---------- */
.h1 { font: 600 40px/44px var(--sans); letter-spacing: -.035em; margin: 6px 0 2px; }
.lede { margin: 0; color: var(--ink-2); font-size: 14px; }
.h2 { font: 600 17px/22px var(--sans); letter-spacing: -.01em; margin: 0; }
.cap { font: 500 12px/16px var(--sans); color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; line-height: 1.45; }
.num { font-family: var(--sans); font-weight: 200; letter-spacing: -.045em; line-height: .95; font-variant-numeric: tabular-nums; }

/* ---------- home: search + filters ---------- */
.searchwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.searchwrap.open { grid-template-rows: 1fr; }
.searchwrap > div { overflow: hidden; }
.search { margin-top: 12px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.search svg { width: 18px; height: 18px; color: var(--ink-3); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
.search input::placeholder { color: var(--ink-3); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 13px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 500 13px/1 var(--sans); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: background-color .25s, color .25s; }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chip .n { opacity: .55; font-variant-numeric: tabular-nums; }

/* ---------- smoothie card: a square glowing in its colours ---------- */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 16px; }
.card { position: relative; aspect-ratio: 1 / 1.12; border-radius: 22px; overflow: hidden; text-align: left; color: var(--fg); isolation: isolate; transition: translate .35s var(--ease); }
@media (hover: hover) { .card:hover { translate: 0 -3px; } }
.card .bgx { position: absolute; inset: 0; z-index: -1; border-radius: inherit; }
.bgx { background:
  radial-gradient(58% 52% at 22% 18%, var(--a) 0%, transparent 72%),
  radial-gradient(62% 56% at 84% 88%, var(--b) 0%, transparent 72%),
  radial-gradient(80% 75% at 50% 52%, var(--c) 0%, var(--c2) 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { color: #fff; } :root:not([data-theme="light"]) .bgx::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(70% 62% at 50% 50%, rgba(8,9,11,.62) 0%, rgba(8,9,11,.22) 55%, transparent 80%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); } }
:root[data-theme="dark"] .card { color: #fff; }
:root[data-theme="dark"] .bgx::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(70% 62% at 50% 50%, rgba(8,9,11,.62) 0%, rgba(8,9,11,.22) 55%, transparent 80%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.card .in { position: absolute; inset: 0; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; }
.card .cnum { font: 500 11px/14px var(--sans); letter-spacing: .005em; opacity: .78; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .nm { font: 600 14.5px/17.5px var(--sans); letter-spacing: -.015em; text-wrap: balance; max-width: 100%; overflow-wrap: anywhere; }

/* ---------- empty state ---------- */
.empty { margin: 28px 0; padding: 26px 20px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty p { margin: 0; color: var(--ink-2); max-width: 36ch; }
.btn { height: 46px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px/1 var(--sans); transition: background-color .25s, color .25s; }
.btn svg { width: 19px; height: 19px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary.done { background: var(--ok); color: #fff; }
.btn.quiet { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.quiet.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; }

/* ---------- recipe ---------- */
.hero { position: relative; margin: calc(-1 * (64px + env(safe-area-inset-top, 0px))) -16px 0; height: calc(330px + env(safe-area-inset-top, 0px)); }
.hero .bgx { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .bgx::after { box-shadow: none; } }
/* the blobs are added only once a screen has settled, and removed before it leaves, so a transition only ever
   captures a still header (Safari otherwise draws the moving blobs outside the header's fade and corners) */
.lava { position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; }
.lava.l1 { left: -18%; top: -12%; background: radial-gradient(closest-side, var(--a), transparent); animation: lava-in 1.2s ease-out both, lava1 14s ease-in-out infinite alternate; }
.lava.l2 { right: -20%; top: 18%; background: radial-gradient(closest-side, var(--b), transparent); animation: lava-in 1.2s ease-out both, lava2 17s ease-in-out infinite alternate; }
.hero.still .lava { animation-play-state: paused; }
@keyframes lava-in { from { opacity: 0; } }
@keyframes lava1 { 0% { transform: translate3d(0,0,0) scale(1, .92); } 50% { transform: translate3d(22%,14%,0) scale(1.12, 1); } 100% { transform: translate3d(42%,4%,0) scale(.94, 1.08); } }
@keyframes lava2 { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(-26%,-10%,0) scale(.9, 1.1); } 100% { transform: translate3d(-40%,12%,0) scale(1.1, .94); } }
.hero .big { position: absolute; left: 0; right: 0; top: calc(92px + env(safe-area-inset-top, 0px)); text-align: center; color: var(--fg); }
:root[data-theme="dark"] .hero .big { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .big { color: #fff; } }
.hero .big .num { font-size: 96px; }
.hero .big .unit { display: block; margin-top: 10px; font: 500 13px/16px var(--sans); opacity: .78; }
.panel { position: relative; margin-top: -86px; border-radius: 26px; padding: 18px 18px 16px; }
.panel .hd { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.panel h1 { font: 600 24px/28px var(--sans); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.panel .src { font: 500 12px/16px var(--sans); color: var(--ink-2); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font: 400 13px/18px var(--sans); color: var(--ink-2); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--k); box-shadow: 0 0 0 1px var(--line); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px 16px; margin-top: 16px; }
.stats .k { font: 400 12px/16px var(--sans); color: var(--ink-2); }
.stats .v { font: 600 17px/22px var(--sans); font-variant-numeric: tabular-nums; margin-top: 2px; }
.blend { margin-top: 16px; }
.blend .bar { position: relative; height: 40px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.blend .fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--stops)); }
.blend .lab { position: absolute; inset: 0; display: grid; grid-template-columns: var(--cols); }
.blend .lab span { display: flex; align-items: center; padding: 0 12px; font: 600 12px/1 var(--sans); color: rgba(0,0,0,.72); white-space: nowrap; overflow: hidden; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
.blend .lab span.lt { color: rgba(255,255,255,.95); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.batchrow { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 20px; }
.batchrow .seg { width: 100%; }
.batchrow .seg button { padding: 0; font-variant-numeric: tabular-nums; }
.card2 { margin-top: 12px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 16px; }
.card2 > .h2 { margin-bottom: 8px; }
.sech { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.quote { margin: 12px 0 0; padding: 16px 18px; border-radius: 22px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 400 17px/24px var(--sans); letter-spacing: -.01em; }
.quote .cap { display: block; margin-top: 6px; }
.note { margin-top: 12px; padding: 16px 18px; border-radius: 22px; background: linear-gradient(135deg, rgba(255,214,120,.22), rgba(255,170,90,.14)); box-shadow: inset 0 0 0 1px rgba(230,160,60,.25); }
.note p { margin: 4px 0 0; font: 500 16px/22px var(--sans); }
.ings { list-style: none; margin: 0; padding: 0; }
.ing { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.ing:first-child { border-top: 0; }
.ck { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-2); display: grid; place-items: center; transition: background-color .25s, box-shadow .25s; }
.ck svg { width: 14px; height: 14px; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .5s var(--spring); color: #fff; }
.ticked .ck { background: var(--ok); box-shadow: none; }
.ticked .ck svg { opacity: 1; transform: none; }
.ing .tx { transition: color .25s; }
.ing.ticked .tx { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.tag { font: 500 11px/1 var(--sans); padding: 4px 8px; border-radius: 999px; }
.tag.buy { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tag.wash { color: var(--ink-2); background: var(--surface-2); }
.tag.safe { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.tag.opt { color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps li::before { counter-increment: s; content: counter(s); font: 300 22px/1 var(--sans); color: var(--ink-3); padding-top: 2px; }
.steps p { margin: 0; }
.timer { margin-top: 10px; }
.timer.run { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.nut { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 18px; }
.nut div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 14px; }
.nut div:nth-child(-n+2) { border-top: 0; }
.nut span:first-child { color: var(--ink-2); }
.nut span:last-child { font-weight: 500; text-align: right; }
.list-ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pn button { position: relative; min-width: 0; height: 84px; border-radius: 22px; overflow: hidden; isolation: isolate; text-align: left; padding: 12px 14px; color: var(--fg); display: grid; align-content: space-between; }
.pn .bgx { position: absolute; inset: 0; z-index: -1; }
:root[data-theme="dark"] .pn button { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pn button { color: #fff; } }
.pn .k { font: 500 11px/14px var(--sans); opacity: .75; }
.pn b { font: 600 14px/18px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- swatch for rows ---------- */
.sw { position: relative; width: 52px; height: 52px; border-radius: 16px; overflow: hidden; flex: none; }
.sw .bgx { position: absolute; inset: 0; }
.sw.xs { width: 38px; height: 38px; border-radius: 12px; }

/* ---------- fridge ---------- */
.groups { display: grid; gap: 16px; }
.cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pick { height: 36px; padding: 0 13px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: 500 14px/1 var(--sans); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; transition: background-color .25s, color .25s; }
.pick i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.pick.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.res { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); text-align: left; }
.rrow b { font: 600 15px/19px var(--sans); letter-spacing: -.01em; display: block; }
.rrow .ms { font-size: 13px; color: var(--ink-2); }
.badge { font: 600 12px/1 var(--sans); padding: 7px 10px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok); color: #fff; }
.badge.near { background: var(--warn-bg); color: var(--warn); }
.badge.far { background: var(--surface-2); color: var(--ink-3); }

.lrow.ticked .nm { color: var(--ink-3); text-decoration: line-through; }

.gl { list-style: none; margin: 0; padding: 0; }
.gl li { padding: 11px 0; border-top: 1px solid var(--line); }
.gl li:first-child { border-top: 0; }

/* ---------- motion ---------- */
/* taps pass through to the new screen while a transition plays, so the app never feels frozen */
::view-transition { pointer-events: none; }
/* every screen bubbles out of the spot you tapped; the page you leave sinks back toward it */
::view-transition-old(root) { animation: vt-sink .5s cubic-bezier(.4,0,.6,1) both; transform-origin: var(--vx, 50%) var(--vy, 50%); }
::view-transition-new(root) { animation: vt-bubble .6s cubic-bezier(.3,.75,.25,1) both; }
::view-transition-old(root), ::view-transition-new(root) { mix-blend-mode: normal; }
::view-transition-image-pair(root) { isolation: auto; }

@keyframes vt-bubble { from { clip-path: circle(0 at var(--vx, 50%) var(--vy, 50%)); } to { clip-path: circle(var(--vr, 150vmax) at var(--vx, 50%) var(--vy, 50%)); } }

::view-transition-old(card), ::view-transition-new(card) { height: 100%; object-fit: cover; }
::view-transition-old(card) { animation: vt-hold .78s cubic-bezier(.6,0,.9,.4) both; mix-blend-mode: normal; }
/* our own fade replaces the browser's, which in Safari also blends the blob lighter and washes it out */
::view-transition-new(card) { animation: vt-show .25s ease-out both; mix-blend-mode: normal; }
@keyframes vt-show { from { opacity: 0; } }
/* going back, the big header dissolves quickly so only the clean card shape is seen shrinking home */
:root[data-vt="pop"]::view-transition-old(card) { animation-duration: .3s; }
@keyframes vt-hold { to { opacity: 0; } }
@keyframes blob-open { 0% { border-radius: 22px; } 38% { border-radius: 44% 56% 38% 62% / 52% 40% 60% 48%; } 70% { border-radius: 30% 24% 36% 28% / 22% 30% 26% 34%; } 100% { border-radius: 0; } }
@keyframes blob-close { 0% { border-radius: 0; } 45% { border-radius: 58% 42% 55% 45% / 45% 58% 42% 55%; } 100% { border-radius: 22px; } }
/* the top buttons ride above the growing blob */
.top { view-transition-name: top; }
::view-transition-group(top) { z-index: 3; }
.panel { view-transition-name: panel; }
::view-transition-group(panel) { z-index: 2; }
::view-transition-new(panel) { animation: none; }
::view-transition-old(panel) { animation: vt-hold .22s ease-in both; }
/* the tab bar stays live so its goo slider is seen moving */
::view-transition-old(tabbar) { display: none; }
::view-transition-new(tabbar) { animation: none; }
@keyframes pop { 0% { transform: scale(1); } 22% { transform: scale(1.38, .78); } 46% { transform: scale(.84, 1.16); } 68% { transform: scale(1.08, .95); } 86% { transform: scale(.98, 1.02); } 100% { transform: scale(1); } }
.pop { animation: pop .6s cubic-bezier(.3,.6,.3,1); }

    const l = list.find(x => x.id === r.id); if (l) { l.x = v; saveList(); }

  $('#ings').addEventListener('click', e => { const li = e.target.closest('.ing'); if (!li) return; const n = +li.dataset.n; ticks.has(n) ? ticks.delete(n) : ticks.add(n); li.classList.toggle('ticked', ticks.has(n)); li.setAttribute('aria-checked', ticks.has(n)); if (!calm()) wobble(li.querySelector('.ck'), 'scale(.7)'); tc(); });
  $('#add').onclick = e => {
    const b = e.currentTarget, i = list.findIndex(x => x.id === r.id);
    if (i >= 0) { list.splice(i, 1); toast('Removed from the list'); } else { list.push({ id: r.id, x: batchOf[r.id] || 1 }); toast('Added to the shopping list'); }
    saveList(); const on = list.some(x => x.id === r.id); b.classList.toggle('done', on); b.querySelector('span').textContent = on ? 'On the list' : 'Add to list';
    if (on && !REDUCE.matches) $('#ldot').animate([{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 400, easing: 'cubic-bezier(.16,1,.3,1)' });
  };
  const tm = $('#timer'); if (tm) { tm.onclick = () => toggleTimer(r); paintTimer(); }
}
function paintIngs(r, s, ticks) {
  return r.ing.map((i, n) => { const o = organic(i); return `<li class="ing ${ticks.has(n) ? 'ticked' : ''}" data-n="${n}" role="checkbox" aria-checked="${ticks.has(n)}" tabindex="0"><span class="ck">${ICON.check}</span><span><span class="tx">${ingText(i, s)}</span>${o || i.opt ? `<span class="tags">${i.opt ? '<span class="tag opt">Optional</span>' : ''}${o ? `<span class="tag ${o}">${TAGLABEL[o]}</span>` : ''}</span>` : ''}</span></li>`; }).join('');
}

/* ===================== FRIDGE ===================== */
function renderFridge() {
  const used = new Set(); R.forEach(r => r.ing.forEach(i => keysOf(i).forEach(k => ING[k][1] !== 'skip' && used.add(k))));
  const groups = {}; [...used].sort((a, b) => ING[a][0].localeCompare(ING[b][0])).forEach(k => (groups[ING[k][1]] ||= []).push(k));
  view.innerHTML = `<div style="height:14px"></div><h1 class="h1">Fridge</h1><p class="lede">Tap what you’ve got. Recipes you can make now rise to the top. Water, ice and salt are assumed.</p>
    <section class="card2"><div class="sech"><h2 class="h2">You have</h2><button class="btn quiet sm" id="fclear">Clear</button></div>
      <div class="groups">${Object.keys(AISLE).filter(a => groups[a]).map(a => `<div><span class="cap">${AISLE[a]}</span><div class="cloud">${groups[a].map(k => `<button class="pick ${fridge.has(k) ? 'on' : ''}" data-k="${k}" aria-pressed="${fridge.has(k)}"><i style="--k:${KCOL[k] || '#999'}"></i>${esc(ING[k][0])}</button>`).join('')}</div></div>`).join('')}</div></section>
    <section id="fsec" style="margin-top:20px"><div class="sech"><h2 class="h2">You can make</h2><span class="cap" id="fcount"></span></div><div class="res" id="fres"></div></section>
    <button class="jump" id="jump" data-off>See matches ↓</button>`;
  $('#jump').onclick = () => $('#fsec').scrollIntoView({ behavior: REDUCE.matches ? 'auto' : 'smooth', block: 'start' });
  screenIO = new IntersectionObserver(([e]) => $('#jump').toggleAttribute('data-off', e.isIntersecting || !fridge.size));
  screenIO.observe($('#fsec'));
  paintFridge();
  view.querySelector('.groups').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k; fridge.has(k) ? fridge.delete(k) : fridge.add(k); b.classList.toggle('on', fridge.has(k)); b.setAttribute('aria-pressed', fridge.has(k)); store.set('fridge', [...fridge]); paintFridge(); });
  $('#fclear').onclick = () => { fridge.clear(); store.set('fridge', []); view.querySelectorAll('.pick').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }); paintFridge(); };
}
function missingFor(r) { return r.ing.filter(i => !i.opt && !keysOf(i).every(k => ING[k][1] === 'skip') && !keysOf(i).some(k => fridge.has(k))).map(i => ING[keysOf(i)[0]][0]); }
function paintFridge() {
  const rows = R.map(r => ({ r, miss: missingFor(r) })).sort((a, b) => a.miss.length - b.miss.length || a.r.name.localeCompare(b.r.name));
  const ready = rows.filter(x => !x.miss.length).length;
  $('#fcount').textContent = fridge.size ? `${ready} ready` : '';
  const j = $('#jump'); if (j) { j.textContent = ready ? `${ready} ready to blend ↓` : 'See matches ↓'; if (!fridge.size) j.setAttribute('data-off', ''); else { const b = $('#fsec').getBoundingClientRect(); j.toggleAttribute('data-off', b.top < innerHeight - 120); } }
  $('#fres').innerHTML = !fridge.size ? `<div class="empty" style="margin:0"><p>Tap a few ingredients above and the recipes you can make will show here.</p></div>` :
    rows.map(({ r, miss }) => `<button class="rrow" data-open="${r.id}">${swatch(r)}<span style="min-width:0"><b>${esc(r.name)}</b><span class="ms">${miss.length ? 'Need ' + esc(miss.slice(0, 3).join(', ')) + (miss.length > 3 ? ` +${miss.length - 3}` : '') : 'You have everything'}</span></span><span class="badge ${!miss.length ? 'ok' : miss.length <= 2 ? 'near' : 'far'}">${!miss.length ? 'Ready' : miss.length + ' short'}</span></button>`).join('');
}

/* ===================== LIST ===================== */
function renderList() {
  view.innerHTML = `<div style="height:14px"></div><h1 class="h1">List</h1><div id="lbody"></div>`;
  paintList();
}
function paintList() {
  const body = $('#lbody');
  if (!list.length) { body.innerHTML = `<p class="lede">Ingredients from every recipe you add are combined here, grouped by aisle.</p><div class="empty"><p>Your list is empty. Open a recipe and tap “Add to list”.</p><button class="btn quiet sm" id="browse">Browse recipes</button></div>`; $('#browse').onclick = () => goTab(''); return; }
  const lines = {};
  list.forEach(({ id, x }) => { const r = BY[id]; r.ing.forEach(i => { const k = keysOf(i)[0]; if (ING[k][1] === 'skip') return; (lines[k] ||= []).push({ r, txt: ingText(i, x).replace(/<[^>]+>/g, ''), opt: i.opt }); }); });
  const byAisle = {}; Object.keys(lines).sort((a, b) => ING[a][0].localeCompare(ING[b][0])).forEach(k => (byAisle[ING[k][1]] ||= []).push(k));
  const total = Object.keys(lines).length, got = Object.keys(lines).filter(k => listTicks[k]).length;
  body.innerHTML = `<p class="lede">${list.length} recipe${list.length > 1 ? 's' : ''} · ${got} of ${total} ingredients ticked</p>
    <div class="inlist" style="display:grid;gap:8px;margin-top:14px">${list.map(({ id, x }) => `<div class="inl"><button class="inlo" data-open="${id}" aria-label="Open ${esc(BY[id].name)}">${swatch(BY[id], 'xs')}<b>${esc(BY[id].name)}</b></button><span class="mini"><button data-dec="${id}" aria-label="Smaller batch">−</button><span>${frac(x)}×</span><button data-inc="${id}" aria-label="Bigger batch">+</button></span><button class="x" data-rm="${id}" aria-label="Remove ${esc(BY[id].name)}">${ICON.x}</button></div>`).join('')}</div>
    ${Object.keys(AISLE).filter(a => byAisle[a]).map(a => `<section class="card2"><div class="sech"><h2 class="h2">${AISLE[a]}</h2><span class="cap">${byAisle[a].length}</span></div>${byAisle[a].map(k => { const t = !!listTicks[k], o = ING[k][2]; return `<div class="lrow ${t ? 'ticked' : ''}" data-k="${k}" role="checkbox" aria-checked="${t}" tabindex="0"><span class="ck">${ICON.check}</span><span style="min-width:0"><span class="nm" style="font-weight:500">${esc(ING[k][0])}</span>${o && o !== 'safe' ? ` <span class="tag ${o}">${TAGLABEL[o]}</span>` : ''}${lines[k].map(l => `<div class="who">${esc(l.txt)} · ${esc(l.r.name)}${l.opt ? ' (optional)' : ''}</div>`).join('')}</span></div>`; }).join('')}</section>`).join('')}
    <div class="rowbtns"><button class="btn primary" id="lshare">${ICON.share}<span>Share list</span></button><button class="btn quiet" id="lticks">Clear ticks</button><button class="btn quiet" id="lclear">Clear list</button></div>`;
  body.querySelectorAll('.lrow').forEach(el => el.onclick = () => { const k = el.dataset.k; listTicks[k] = !listTicks[k]; if (!listTicks[k]) delete listTicks[k]; el.classList.toggle('ticked', !!listTicks[k]); el.setAttribute('aria-checked', !!listTicks[k]); saveList(); const g = Object.keys(lines).filter(k => listTicks[k]).length; body.querySelector('.lede').textContent = `${list.length} recipe${list.length > 1 ? 's' : ''} · ${g} of ${total} ingredients ticked`; });
  body.querySelectorAll('[data-inc],[data-dec]').forEach(b => b.onclick = () => { const id = b.dataset.inc || b.dataset.dec, it = list.find(x => x.id === id), i = STEPS.indexOf(it.x); it.x = STEPS[Math.max(0, Math.min(STEPS.length - 1, i + (b.dataset.inc ? 1 : -1)))]; batchOf[id] = it.x; saveList(); paintList(); });
  body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { list = list.filter(x => x.id !== b.dataset.rm); saveList(); paintList(); toast('Removed from the list'); });
  $('#lticks').onclick = () => { listTicks = {}; saveList(); paintList(); };
  $('#lclear').onclick = e => { const b = e.currentTarget; if (b.dataset.sure) { list = []; listTicks = {}; saveList(); paintList(); toast('List cleared'); } else { b.dataset.sure = 1; b.textContent = 'Tap again to clear'; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = 'Clear list'; } }, 3000); } };
  $('#lshare').onclick = () => {
    const txt = 'Smoothie shopping list\n' + Object.keys(AISLE).filter(a => byAisle[a]).map(a => `\n${AISLE[a]}\n` + byAisle[a].filter(k => !listTicks[k]).map(k => `• ${ING[k][0]}: ${lines[k].map(l => l.txt).join(' + ')}`).join('\n')).join('\n');
    shareText(txt, 'Smoothie shopping list');
  };
}

/* ===================== GUIDE ===================== */
function renderGuide() {
  const usedIn = keys => R.filter(r => r.ing.some(i => keysOf(i).some(k => keys.includes(k))));
  const sec = (title, note, items, cls) => `<section class="card2"><div class="sech"><h2 class="h2">${title}</h2><span class="tag ${cls}">${items.length}</span></div><p class="small muted" style="margin:0 0 4px">${note}</p>
    <ul class="gl">${items.map(([n, d, keys]) => { const rs = usedIn(keys); return `<li><b>${esc(n)}</b><p>${esc(d)}</p>${rs.length ? `<span class="in">${rs.map(r => `<button data-open="${r.id}"><i style="${grad(r)}"><span class="bgx"></span></i>${esc(r.name)}</button>`).join('')}</span>` : ''}</li>`; }).join('')}</ul></section>`;
  view.innerHTML = `<div style="height:14px"></div><h1 class="h1">Guide</h1><p class="lede">Which produce is worth buying organic, from the handout Mum keeps with the recipes. Her pencil marks say what she does with each one.</p>
    ${sec('Buy organic', 'Mum marked these “Buy”.', GUIDE.buy, 'buy')}
    ${sec('Wash well', 'Mum marked these “Wash”.', GUIDE.wash, 'wash')}
    ${sec('Fine non-organic', 'Lower residues or thick skins, per the handout.', GUIDE.safe, 'safe')}
    <p class="credit">From the handout “Smart Shopping: The Best and Worst Non-Organic Foods for Your Health” by Dr Brad Leech, Nutrition + Wellness. Reasons are summarised.</p>`;
}

view.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.matches('.ing, .lrow')) { e.preventDefault(); e.target.click(); } });
updateDot();
render();
</script>

</body>
